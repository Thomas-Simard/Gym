<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym Sous-Sol</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #222631;
    --border: #2d3240;
    --text: #eef0f5;
    --muted: #9aa1b2;
    --accent: #f97316;
    --accent-ink: #1a0d02;
    --ok: #22c55e;
    --ok-bg: #12301f;
    --danger: #ef4444;
    --radius: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + var(--safe-b));
    min-height: 100vh;
  }
  body.timer-on { padding-bottom: calc(150px + var(--safe-b)); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 4px 0 4px; }
  h2 { font-size: 1.15rem; margin: 0; }
  h3 { font-size: 1rem; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .stack > * + * { margin-top: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .card.highlight { border-color: var(--accent); }
  .tag {
    white-space: nowrap; flex-shrink: 0;
    display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: var(--surface-2); color: var(--muted);
  }
  .tag.accent { background: var(--accent); color: var(--accent-ink); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  ul.plain { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.plain li { padding: 4px 0; display: flex; justify-content: space-between; gap: 8px; }

  button, .btn {
    font: inherit; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 12px; padding: 12px 14px; min-height: 48px;
    cursor: pointer; font-weight: 600;
  }
  button:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-ghost { background: transparent; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 36px; padding: 6px 10px; font-size: .85rem; border-radius: 10px; }

  input, textarea, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; width: 100%;
    min-height: 44px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }

  /* Séance active */
  .sets { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .sets th { font-size: .75rem; color: var(--muted); font-weight: 600; text-align: left; padding: 0 4px 4px; }
  .sets td { padding: 4px; vertical-align: middle; }
  .sets td.num { width: 34px; text-align: center; color: var(--muted); font-weight: 700; }
  .sets td.chk { width: 56px; }
  .sets input { text-align: center; font-size: 1.1rem; font-weight: 600; padding: 8px 4px; }
  .sets tr.done input { background: var(--ok-bg); border-color: var(--ok); }
  .check {
    width: 52px; height: 48px; padding: 0; font-size: 1.3rem; border-radius: 12px;
  }
  tr.done .check { background: var(--ok); border-color: var(--ok); color: #04210f; }
  .hint { margin-top: 6px; font-size: .85rem; color: var(--accent); font-weight: 600; }
  .last { margin-top: 4px; font-size: .85rem; color: var(--muted); }

  /* Navigation */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-b);
  }
  nav.tabs button {
    border: 0; border-radius: 0; background: transparent; color: var(--muted);
    min-height: 64px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; font-size: .75rem;
  }
  nav.tabs button span { font-size: 1.35rem; line-height: 1; }
  nav.tabs button.active { color: var(--accent); }

  /* Minuteur de repos */
  .timer {
    position: fixed; left: 0; right: 0; bottom: calc(64px + var(--safe-b)); z-index: 9;
    background: var(--surface-2); border-top: 2px solid var(--accent);
    padding: 10px 16px; display: none;
  }
  body.timer-on .timer { display: block; }
  .timer .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .timer .time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; flex: 1; }
  .timer.finished { border-top-color: var(--ok); }
  .timer.finished .time { color: var(--ok); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .seg button { min-height: 40px; border: 0; background: transparent; color: var(--muted); }
  .seg button.active { background: var(--surface-2); color: var(--text); }

  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .ex-edit { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .ex-edit .full { grid-column: 1 / -1; }
  .ex-edit input { padding: 8px; min-height: 40px; font-size: .95rem; }
  .ex-edit button { min-height: 40px; padding: 0; }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 20;
    background: var(--ok); color: #04210f; font-weight: 700; padding: 10px 16px;
    border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main id="app"></main>

<div class="timer" id="timer">
  <div class="inner">
    <div>
      <div class="small muted">Repos</div>
      <div class="time" id="timerTime">0:00</div>
    </div>
    <button class="btn-sm" data-action="timer-add" data-sec="-15">−15 s</button>
    <button class="btn-sm" data-action="timer-add" data-sec="15">+15 s</button>
    <button class="btn-sm btn-primary" data-action="timer-stop">OK</button>
  </div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="seance"><span>🏋️</span>Séance</button>
  <button data-tab="historique"><span>📅</span>Historique</button>
  <button data-tab="programme"><span>📝</span>Programme</button>
  <button data-tab="reglages"><span>⚙️</span>Réglages</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // ---------- Programme par défaut ----------
  const DEFAULT_PROGRAM = [
    { id: 'j1', name: 'Jour 1', focus: 'Force & Base', exercises: [
      { name: 'Goblet Squat', sets: 4, reps: '8-10' },
      { name: 'Développé couché ou incliné', sets: 4, reps: '8-10' },
      { name: 'Tirage unilatéral (Rowing haltère)', sets: 4, reps: '10-12' },
      { name: 'Élévations latérales', sets: 3, reps: '12-15' },
      { name: 'Curls biceps', sets: 3, reps: '10-12' },
    ]},
    { id: 'j2', name: 'Jour 2', focus: 'Volume & Posture', exercises: [
      { name: 'Soulevé de terre jambes tendues', sets: 4, reps: '8-10' },
      { name: 'Développé militaire debout', sets: 4, reps: '8-10' },
      { name: 'Tractions ou Rowing buste penché', sets: 4, reps: '8-10' },
      { name: 'Fentes marchées ou arrière', sets: 3, reps: '10 / jambe' },
      { name: 'Extension triceps au-dessus de la tête', sets: 3, reps: '10-12' },
    ]},
    { id: 'j3', name: 'Jour 3', focus: 'Équilibre & Finition', exercises: [
      { name: 'Squat bulgare', sets: 3, reps: '8-10 / jambe' },
      { name: 'Pompes lestées', sets: 4, reps: 'Échec' },
      // Les exercices ci-dessous complètent le Jour 3 (modifiables dans l'onglet Programme).
      { name: 'Rowing haltère buste penché', sets: 3, reps: '10-12' },
      { name: 'Curl marteau', sets: 3, reps: '10-12' },
      { name: 'Gainage planche', sets: 3, reps: '30-60 s' },
    ]},
  ];

  const STORAGE_KEY = 'gymSousSol.v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function freshProgram() {
    return clone(DEFAULT_PROGRAM).map(d => ({
      ...d, exercises: d.exercises.map(e => ({ id: uid(), ...e }))
    }));
  }

  // ---------- État + persistance ----------
  let state = load();
  let tab = 'seance';
  let historyMode = 'seances';

  function load() {
    const base = { program: freshProgram(), history: [], draft: null,
      settings: { unit: 'lb', rest: 90, sound: true } };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      const data = JSON.parse(raw);
      return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
    } catch (e) { return base; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('⚠️ Sauvegarde impossible'); }
  }

  // ---------- Utilitaires ----------
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
  const fmtNum = (n) => n == null ? '' : (Math.round(n * 10) / 10).toString().replace('.', ',');
  const fmtDate = (ts) => new Date(ts).toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const fmtDur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; };
  const fmtClock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const key = (name) => name.trim().toLowerCase();
  const topReps = (reps) => { const m = String(reps).match(/(\d+)\s*(?:-\s*(\d+))?/); return m ? Number(m[2] || m[1]) : null; };
  const isTimeTarget = (reps) => /\b(s|sec|min)\b/i.test(reps);

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Dernière performance enregistrée pour un exercice (par nom).
  function lastPerf(name) {
    for (let i = state.history.length - 1; i >= 0; i--) {
      const s = state.history[i];
      const ex = s.exercises.find(e => key(e.name) === key(name));
      if (ex) {
        const sets = ex.sets.filter(x => x.done);
        if (sets.length) return { date: s.end, sets, target: ex };
      }
    }
    return null;
  }

  // Suggestion de surcharge progressive : toutes les séries faites au haut de la fourchette.
  function progressionHint(ex, last) {
    if (!last || isTimeTarget(ex.reps)) return '';
    const top = topReps(ex.reps);
    if (!top) return '';
    const done = last.sets;
    if (done.length < ex.sets) return '';
    if (done.every(s => (num(s.r) || 0) >= top)) {
      return `↑ Toutes les séries à ${top} réps la dernière fois : augmente la charge.`;
    }
    return '';
  }

  function nextDayId() {
    if (!state.history.length) return state.program[0]?.id;
    const lastId = state.history[state.history.length - 1].dayId;
    const idx = state.program.findIndex(d => d.id === lastId);
    return state.program[(idx + 1) % state.program.length]?.id;
  }

  // ---------- Rendu ----------
  function render() {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (tab === 'seance') state.draft ? renderWorkout() : renderHome();
    else if (tab === 'historique') renderHistory();
    else if (tab === 'programme') renderProgram();
    else renderSettings();
  }

  function renderHome() {
    const next = nextDayId();
    const last = state.history[state.history.length - 1];
    $app.innerHTML = `
      <div class="stack">
        <div>
          <h1>Gym Sous-Sol 💪</h1>
          <p class="muted small">${last ? `Dernière séance : ${esc(last.dayName)} — ${fmtDate(last.end)}` : 'Aucune séance enregistrée pour l\'instant.'}</p>
        </div>
        ${state.program.map(d => `
          <div class="card ${d.id === next ? 'highlight' : ''}">
            <div class="row between">
              <div>
                <h2>${esc(d.name)}</h2>
                <p class="muted small">${esc(d.focus)}</p>
              </div>
              ${d.id === next ? '<span class="tag accent">Suggéré</span>' : ''}
            </div>
            <ul class="plain small">
              ${d.exercises.map(e => `<li><span>${esc(e.name)}</span><span class="muted">${e.sets} × ${esc(e.reps)}</span></li>`).join('')}
            </ul>
            <button class="btn-block ${d.id === next ? 'btn-primary' : ''}" style="margin-top:10px" data-action="start" data-day="${d.id}">Commencer ${esc(d.name)}</button>
          </div>`).join('')}
      </div>`;
  }

  function renderWorkout() {
    const w = state.draft;
    const unit = state.settings.unit;
    const doneCount = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    const total = w.exercises.reduce((a, e) => a + e.sets.length, 0);
    $app.innerHTML = `
      <div class="stack">
        <div class="row between">
          <div>
            <h1>${esc(w.dayName)}</h1>
            <p class="muted small">${esc(w.focus)} · <span id="elapsed">${fmtDur(Date.now() - w.start)}</span> · ${doneCount}/${total} séries</p>
          </div>
        </div>
        ${w.exercises.map((ex, i) => {
          const last = lastPerf(ex.name);
          const hint = progressionHint(ex, last);
          const timeT = isTimeTarget(ex.reps);
          return `
          <div class="card" data-ex="${i}">
            <div class="row between">
              <h3>${esc(ex.name)}</h3>
              <span class="tag ${ex.sets.length && ex.sets.every(s => s.done) ? 'ok' : ''}">${ex.target.sets} × ${esc(ex.reps)}</span>
            </div>
            ${last ? `<p class="last">Dernière fois (${new Date(last.date).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' })}) : ${last.sets.map(s => `${s.w ? fmtNum(num(s.w)) + '×' : ''}${esc(s.r)}`).join(' · ')}</p>` : '<p class="last">Première fois — choisis une charge confortable.</p>'}
            ${hint ? `<p class="hint">${hint}</p>` : ''}
            <table class="sets">
              <thead><tr><th>#</th><th>Charge (${unit})</th><th>${timeT ? 'Secondes' : 'Réps'}</th><th></th></tr></thead>
              <tbody>
                ${ex.sets.map((s, j) => {
                  const ref = last && (last.sets[j] || last.sets[last.sets.length - 1]);
                  return `
                  <tr class="${s.done ? 'done' : ''}">
                    <td class="num">${j + 1}</td>
                    <td><input inputmode="decimal" data-field="w" data-ex="${i}" data-set="${j}" value="${esc(s.w)}" placeholder="${ref && ref.w ? esc(ref.w) : '—'}" aria-label="Charge série ${j + 1}"></td>
                    <td><input inputmode="numeric" data-field="r" data-ex="${i}" data-set="${j}" value="${esc(s.r)}" placeholder="${ref ? esc(ref.r) : (topReps(ex.reps) || '—')}" aria-label="Répétitions série ${j + 1}"></td>
                    <td class="chk"><button class="check" data-action="toggle-set" data-ex="${i}" data-set="${j}" aria-label="Série terminée">✓</button></td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            <div class="row" style="margin-top:8px">
              <button class="btn-sm btn-ghost" data-action="add-set" data-ex="${i}">+ Série</button>
              <button class="btn-sm btn-ghost" data-action="remove-set" data-ex="${i}" ${ex.sets.length <= 1 ? 'disabled' : ''}>− Série</button>
            </div>
          </div>`;
        }).join('')}
        <div class="card">
          <label for="notes">Notes de séance</label>
          <textarea id="notes" rows="2" data-field="notes" placeholder="Énergie, douleurs, ajustements…">${esc(w.notes)}</textarea>
        </div>
        <button class="btn-block btn-primary" data-action="finish">Terminer la séance ✅</button>
        <button class="btn-block btn-danger" data-action="cancel">Abandonner la séance</button>
      </div>`;
  }

  function sessionVolume(s) {
    return s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).reduce((b, x) => b + (num(x.w) || 0) * (num(x.r) || 0), 0), 0);
  }

  function renderHistory() {
    const unit = state.settings.unit;
    let body;
    if (historyMode === 'seances') {
      body = state.history.length ? state.history.slice().reverse().map(s => `
        <details class="card">
          <summary>
            <div class="row between">
              <div>
                <h3>${esc(s.dayName)} <span class="muted small">· ${esc(s.focus || '')}</span></h3>
                <p class="muted small">${fmtDate(s.end)} · ${fmtDur(s.end - s.start)} · ${Math.round(sessionVolume(s)).toLocaleString('fr-CA')} ${unit} soulevés</p>
              </div>
              <span class="muted">▾</span>
            </div>
          </summary>
          <ul class="plain small">
            ${s.exercises.map(e => {
              const d = e.sets.filter(x => x.done);
              return `<li><span>${esc(e.name)}</span><span class="muted" style="text-align:right">${d.length ? d.map(x => `${x.w ? fmtNum(num(x.w)) + '×' : ''}${esc(x.r)}`).join(' · ') : '—'}</span></li>`;
            }).join('')}
          </ul>
          ${s.notes ? `<p class="small" style="margin-top:8px">📝 ${esc(s.notes)}</p>` : ''}
          <button class="btn-sm btn-danger" style="margin-top:10px" data-action="delete-session" data-id="${s.id}">Supprimer</button>
        </details>`).join('') : '<p class="muted">Aucune séance terminée pour l\'instant.</p>';
    } else {
      const recs = {};
      state.history.forEach(s => s.exercises.forEach(e => e.sets.filter(x => x.done).forEach(x => {
        const w = num(x.w), r = num(x.r);
        if (!w || !r) return;
        const est = w * (1 + r / 30); // Formule d'Epley
        const k = key(e.name);
        if (!recs[k] || w > recs[k].w || (w === recs[k].w && r > recs[k].r)) {
          recs[k] = { name: e.name, w, r, date: s.end, est: Math.max(est, recs[k]?.est || 0) };
        } else if (est > recs[k].est) recs[k].est = est;
      })));
      const list = Object.values(recs).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      body = list.length ? `<div class="card"><ul class="plain">
        ${list.map(r => `<li><span>${esc(r.name)}<br><span class="muted small">${fmtDate(r.date)}</span></span>
          <span style="text-align:right"><strong>${fmtNum(r.w)} ${unit} × ${fmtNum(r.r)}</strong><br><span class="muted small">1RM est. ≈ ${fmtNum(Math.round(r.est))} ${unit}</span></span></li>`).join('')}
      </ul></div>` : '<p class="muted">Les records apparaîtront après ta première séance avec des charges.</p>';
    }
    $app.innerHTML = `
      <div class="stack">
        <h1>Historique</h1>
        <div class="seg">
          <button data-action="hist-mode" data-mode="seances" class="${historyMode === 'seances' ? 'active' : ''}">Séances (${state.history.length})</button>
          <button data-action="hist-mode" data-mode="records" class="${historyMode === 'records' ? 'active' : ''}">Records</button>
        </div>
        ${body}
      </div>`;
  }

  function renderProgram() {
    $app.innerHTML = `
      <div class="stack">
        <h1>Programme</h1>
        <p class="muted small">Les modifications sont enregistrées automatiquement. L'historique est relié aux exercices par leur nom.</p>
        ${state.program.map((d, di) => `
          <div class="card">
            <div class="row">
              <input data-prog="day-name" data-day="${di}" value="${esc(d.name)}" style="flex:1" aria-label="Nom du jour">
              <input data-prog="day-focus" data-day="${di}" value="${esc(d.focus)}" style="flex:2" aria-label="Focus">
            </div>
            ${d.exercises.map((e, ei) => `
              <div class="ex-edit">
                <input class="full" data-prog="ex-name" data-day="${di}" data-ex="${ei}" value="${esc(e.name)}" aria-label="Nom de l'exercice">
                <label class="row" style="margin:0">Séries <input data-prog="ex-sets" data-day="${di}" data-ex="${ei}" value="${e.sets}" inputmode="numeric"></label>
                <label class="row" style="margin:0">Réps <input data-prog="ex-reps" data-day="${di}" data-ex="${ei}" value="${esc(e.reps)}"></label>
                <button class="btn-danger" data-action="del-ex" data-day="${di}" data-ex="${ei}" aria-label="Supprimer">✕</button>
              </div>`).join('')}
            <button class="btn-sm" style="margin-top:10px" data-action="add-ex" data-day="${di}">+ Ajouter un exercice</button>
          </div>`).join('')}
        <button class="btn-block btn-danger" data-action="reset-program">Rétablir le programme par défaut</button>
      </div>`;
  }

  function renderSettings() {
    const s = state.settings;
    $app.innerHTML = `
      <div class="stack">
        <h1>Réglages</h1>
        <div class="card stack">
          <div>
            <label>Unité de charge</label>
            <div class="seg">
              <button data-action="unit" data-unit="lb" class="${s.unit === 'lb' ? 'active' : ''}">Livres (lb)</button>
              <button data-action="unit" data-unit="kg" class="${s.unit === 'kg' ? 'active' : ''}">Kilos (kg)</button>
            </div>
          </div>
          <div>
            <label for="rest">Temps de repos par défaut (secondes)</label>
            <select id="rest" data-setting="rest">
              ${[45, 60, 75, 90, 120, 150, 180, 240].map(v => `<option value="${v}" ${s.rest === v ? 'selected' : ''}>${fmtClock(v)}</option>`).join('')}
            </select>
          </div>
          <div class="row between">
            <span>Bip + vibration à la fin du repos</span>
            <button class="btn-sm" data-action="sound">${s.sound ? 'Activé' : 'Désactivé'}</button>
          </div>
        </div>
        <div class="card stack">
          <h3>Sauvegarde</h3>
          <p class="muted small">Les données restent uniquement sur cet appareil (navigateur). Exporte régulièrement une copie de sécurité.</p>
          <button class="btn-block" data-action="export">⬇️ Exporter mes données (.json)</button>
          <button class="btn-block" data-action="import">⬆️ Importer une sauvegarde</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <button class="btn-block btn-danger" data-action="wipe">Effacer toutes les données</button>
        <p class="muted small" style="text-align:center">${state.history.length} séance(s) enregistrée(s)</p>
      </div>`;
  }

  // ---------- Actions séance ----------
  function startWorkout(dayId) {
    const d = state.program.find(x => x.id === dayId);
    if (!d) return;
    state.draft = {
      id: uid(), dayId: d.id, dayName: d.name, focus: d.focus, start: Date.now(), notes: '',
      exercises: d.exercises.map(e => ({
        name: e.name, reps: e.reps, target: { sets: e.sets, reps: e.reps },
        sets: Array.from({ length: Math.max(1, Number(e.sets) || 1) }, () => ({ w: '', r: '', done: false })),
      })),
    };
    save(); requestWakeLock(); render(); window.scrollTo(0, 0);
  }

  function toggleSet(i, j) {
    const ex = state.draft.exercises[i];
    const s = ex.sets[j];
    if (!s.done) {
      // Remplit les champs vides avec la référence affichée (dernière fois / série précédente).
      const row = $app.querySelector(`tr input[data-ex="${i}"][data-set="${j}"][data-field="w"]`);
      const rowR = $app.querySelector(`tr input[data-ex="${i}"][data-set="${j}"][data-field="r"]`);
      const prev = ex.sets[j - 1];
      if (!s.w) s.w = (prev && prev.w) || (row && row.placeholder !== '—' ? row.placeholder : '');
      if (!s.r) s.r = (rowR && rowR.placeholder !== '—' ? rowR.placeholder : '') || (prev && prev.r) || '';
      s.done = true;
      startTimer(state.settings.rest);
    } else {
      s.done = false;
    }
    save(); render();
  }

  function finishWorkout() {
    const w = state.draft;
    const done = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    if (!done && !confirm('Aucune série cochée. Enregistrer quand même ?')) return;
    w.end = Date.now();
    state.history.push(w);
    state.draft = null;
    stopTimer(); releaseWakeLock(); save();
    tab = 'historique'; historyMode = 'seances';
    render(); window.scrollTo(0, 0);
    toast('Séance enregistrée 🎉');
  }

  // ---------- Minuteur de repos ----------
  let timerEnd = 0, timerInt = null, timerRang = false, audioCtx = null;
  const $timer = document.getElementById('timer');
  const $timerTime = document.getElementById('timerTime');

  function startTimer(sec) {
    timerEnd = Date.now() + sec * 1000; timerRang = false;
    document.body.classList.add('timer-on');
    $timer.classList.remove('finished');
    unlockAudio();
    clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); tickTimer();
  }
  function stopTimer() {
    clearInterval(timerInt); timerInt = null;
    document.body.classList.remove('timer-on');
  }
  function tickTimer() {
    const left = Math.round((timerEnd - Date.now()) / 1000);
    if (left > 0) { $timerTime.textContent = fmtClock(left); return; }
    $timerTime.textContent = 'Go ! ' + fmtClock(Math.abs(left));
    if (!timerRang) {
      timerRang = true; $timer.classList.add('finished');
      if (state.settings.sound) { beep(); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {} }
    }
  }
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  }
  function beep() {
    if (!audioCtx) return;
    try {
      [0, 0.25, 0.5].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
      });
    } catch (e) {}
  }

  // Garde l'écran allumé pendant la séance (si supporté).
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator && state.draft) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });

  // Chronomètre de séance
  setInterval(() => {
    const el = document.getElementById('elapsed');
    if (el && state.draft) el.textContent = fmtDur(Date.now() - state.draft.start);
  }, 15000);

  // ---------- Événements ----------
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const a = b.dataset.action;
    const i = Number(b.dataset.ex), j = Number(b.dataset.set), di = Number(b.dataset.day);
    switch (a) {
      case 'start':
        if (state.draft && !confirm('Une séance est déjà en cours. La remplacer ?')) return;
        startWorkout(b.dataset.day); break;
      case 'toggle-set': toggleSet(i, j); break;
      case 'add-set': {
        const sets = state.draft.exercises[i].sets;
        const last = sets[sets.length - 1] || {};
        sets.push({ w: last.w || '', r: '', done: false }); save(); render(); break;
      }
      case 'remove-set': state.draft.exercises[i].sets.pop(); save(); render(); break;
      case 'finish': finishWorkout(); break;
      case 'cancel':
        if (confirm('Abandonner cette séance ? Les séries saisies seront perdues.')) {
          state.draft = null; stopTimer(); releaseWakeLock(); save(); render();
        }
        break;
      case 'timer-add': timerEnd += Number(b.dataset.sec) * 1000; timerRang = false; $timer.classList.remove('finished'); tickTimer(); break;
      case 'timer-stop': stopTimer(); break;
      case 'hist-mode': historyMode = b.dataset.mode; render(); break;
      case 'delete-session':
        if (confirm('Supprimer définitivement cette séance ?')) {
          state.history = state.history.filter(s => s.id !== b.dataset.id); save(); render();
        }
        break;
      case 'add-ex': state.program[di].exercises.push({ id: uid(), name: 'Nouvel exercice', sets: 3, reps: '10-12' }); save(); render(); break;
      case 'del-ex':
        if (confirm(`Retirer « ${state.program[di].exercises[i].name} » du programme ?`)) {
          state.program[di].exercises.splice(i, 1); save(); render();
        }
        break;
      case 'reset-program':
        if (confirm('Rétablir le programme d\'origine ? Ton historique est conservé.')) {
          state.program = freshProgram(); save(); render(); toast('Programme rétabli');
        }
        break;
      case 'unit': state.settings.unit = b.dataset.unit; save(); render(); break;
      case 'sound': state.settings.sound = !state.settings.sound; save(); render(); break;
      case 'export': exportData(); break;
      case 'import': document.getElementById('importFile').click(); break;
      case 'wipe':
        if (confirm('Effacer TOUT (historique, programme, réglages) ? Action irréversible.')) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
          state = load(); stopTimer(); render(); toast('Données effacées');
        }
        break;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.field && state.draft) {
      if (t.dataset.field === 'notes') state.draft.notes = t.value;
      else state.draft.exercises[t.dataset.ex].sets[t.dataset.set][t.dataset.field] = t.value.trim();
      save(); return;
    }
    if (t.dataset.prog) {
      const d = state.program[t.dataset.day];
      const ex = d.exercises[t.dataset.ex];
      switch (t.dataset.prog) {
        case 'day-name': d.name = t.value; break;
        case 'day-focus': d.focus = t.value; break;
        case 'ex-name': ex.name = t.value; break;
        case 'ex-sets': ex.sets = Math.min(10, Math.max(1, parseInt(t.value, 10) || 1)); break;
        case 'ex-reps': ex.reps = t.value; break;
      }
      save();
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.setting === 'rest') { state.settings.rest = Number(t.value); save(); toast('Repos : ' + fmtClock(state.settings.rest)); }
    if (t.id === 'importFile' && t.files[0]) importData(t.files[0]);
  });

  // ---------- Export / Import ----------
  function exportData() {
    const data = JSON.stringify({ app: 'gym-sous-sol', version: 1, exportedAt: new Date().toISOString(), ...state, draft: null }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gym-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.history) || !Array.isArray(data.program)) throw new Error('format');
        if (!confirm(`Importer ${data.history.length} séance(s) ? Les données actuelles seront remplacées.`)) return;
        state = { program: data.program, history: data.history, draft: null,
          settings: { ...state.settings, ...(data.settings || {}) } };
        save(); render(); toast('Sauvegarde importée');
      } catch (err) { alert('Fichier invalide : ce n\'est pas une sauvegarde de cette application.'); }
    };
    reader.readAsText(file);
  }

  // Cache hors-ligne quand l'app est hébergée (ignoré si le fichier est ouvert directement).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Démarrage
  if (state.draft) requestWakeLock();
  render();
})();
</script>
</body>
</html>
