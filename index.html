<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym Sous-Sol</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #222631;
    --border: #2d3240;
    --text: #eef0f5;
    --muted: #9aa1b2;
    --accent: #f97316;
    --accent-ink: #1a0d02;
    --ok: #22c55e;
    --ok-bg: #12301f;
    --ok-ink: #04210f;
    --danger: #ef4444;
    --radius: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + var(--safe-b));
    min-height: 100vh;
  }
  body.timer-on { padding-bottom: calc(210px + var(--safe-b)); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 4px 0; }
  h2 { font-size: 1.2rem; margin: 0; }
  h3 { font-size: 1.05rem; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .stack > * + * { margin-top: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .card.highlight { border-color: var(--accent); }
  .tag {
    display: inline-block; white-space: nowrap; flex-shrink: 0;
    font-size: .8rem; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; background: var(--surface-2); color: var(--muted);
  }
  .tag.accent { background: var(--accent); color: var(--accent-ink); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.rest { color: var(--text); border: 1px solid var(--border); }
  ul.plain { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.plain li { padding: 5px 0; display: flex; justify-content: space-between; gap: 8px; }

  button {
    font: inherit; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 12px; padding: 12px 14px; min-height: 52px;
    cursor: pointer; font-weight: 700;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-ghost { background: transparent; }
  .btn-block { width: 100%; }
  .btn-big { min-height: 64px; font-size: 1.15rem; }
  .btn-sm { min-height: 40px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; }

  input, textarea, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; width: 100%;
    min-height: 48px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }

  /* Choix de séance */
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick button { min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .pick .big { font-size: 1.6rem; font-weight: 800; }
  .pick .sub { font-size: .8rem; font-weight: 600; opacity: .85; }

  /* Exercices */
  .ex-head { display: flex; align-items: flex-start; gap: 10px; }
  .ex-head .title { flex: 1; min-width: 0; }
  .ex-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; align-items: center; }
  .thumb {
    width: 60px; height: 60px; padding: 0; min-height: 0; border-radius: 10px; overflow: hidden;
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface-2);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.sm { width: 42px; height: 42px; border-radius: 8px; }
  .link { white-space: nowrap; background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); font-size: .9rem; font-weight: 700; }
  ul.plain li.ex-li { justify-content: flex-start; align-items: center; gap: 10px; }
  ul.plain li.ex-li .name { flex: 1; min-width: 0; }
  .hint { margin-top: 8px; font-size: .9rem; color: var(--accent); font-weight: 700; }
  .last { margin-top: 6px; font-size: .85rem; color: var(--muted); }

  /* Séries */
  .sets { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .sets th { font-size: .75rem; color: var(--muted); font-weight: 700; text-align: left; padding: 0 4px 4px; }
  .sets td { padding: 4px; vertical-align: middle; }
  .sets td.num { width: 30px; text-align: center; color: var(--muted); font-weight: 800; }
  .sets td.chk { width: 60px; }
  .sets input { text-align: center; font-size: 1.2rem; font-weight: 700; padding: 8px 4px; min-height: 52px; }
  .sets tr.done input { background: var(--ok-bg); border-color: var(--ok); }
  .check { width: 56px; height: 52px; padding: 0; font-size: 1.4rem; }
  tr.done .check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  .side { display: block; font-size: .72rem; color: var(--muted); text-align: center; margin-top: 2px; min-height: 1em; }
  .seg.mini { display: inline-grid; padding: 2px; gap: 2px; border-radius: 10px; }
  .seg.mini button { min-height: 32px; padding: 2px 10px; font-size: .8rem; }
  .rest-btn { width: 100%; min-height: 48px; background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }

  /* Navigation */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-b);
  }
  nav.tabs button {
    border: 0; border-radius: 0; background: transparent; color: var(--muted);
    min-height: 64px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; font-size: .75rem;
  }
  nav.tabs button span { font-size: 1.35rem; line-height: 1; }
  nav.tabs button.active { color: var(--accent); }

  /* Minuteur de repos */
  .timer {
    position: fixed; left: 0; right: 0; bottom: calc(64px + var(--safe-b)); z-index: 9;
    background: var(--surface-2); border-top: 3px solid var(--accent);
    padding: 10px 16px 12px; display: none;
  }
  body.timer-on .timer { display: block; }
  .timer .inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .timer .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .timer .label { font-size: .85rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer .time { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .timer .bar { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .timer .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
  .timer .ctrls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .timer .ctrls button { min-height: 48px; padding: 4px; }
  .timer.finished { border-top-color: var(--ok); }
  .timer.finished .time { color: var(--ok); }
  .timer.finished .bar i { background: var(--ok); }

  /* Flash visuel à la fin du repos */
  .flash { position: fixed; inset: 0; z-index: 40; background: var(--ok); pointer-events: none; opacity: 0; }
  .flash.go { animation: flash 1.8s ease-out; }
  @keyframes flash { 0%, 33%, 66% { opacity: .75; } 16%, 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flash.go { animation: none; opacity: .4; transition: opacity 1.5s; } }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .seg button { min-height: 44px; border: 0; background: transparent; color: var(--muted); }
  .seg button.active { background: var(--surface-2); color: var(--text); }

  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  /* Éditeur de programme */
  .ex-edit { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-items: end; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .ex-edit .full { grid-column: 1 / -1; }
  .ex-edit .span2 { grid-column: span 2; }
  .ex-edit label { margin-bottom: 2px; font-size: .75rem; }
  .ex-edit input, .ex-edit select { padding: 8px; min-height: 44px; font-size: .95rem; }
  .ex-edit button { min-height: 44px; padding: 0; }

  .modal {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    padding-bottom: calc(16px + var(--safe-b));
  }
  .modal[hidden] { display: none; }
  .modal .sheet {
    width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal .sheet p { font-size: 1.05rem; }
  .modal .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .viewer .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .viewer figure { margin: 0; min-width: 0; }
  .viewer figure img { width: 100%; max-height: 42vh; object-fit: contain; background: var(--bg); border-radius: 10px; display: block; }
  .viewer figcaption { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  textarea.mono { font: .8rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 50;
    background: var(--ok); color: var(--ok-ink); font-weight: 700; padding: 10px 16px;
    border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main id="app"></main>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="inner">
    <div class="top">
      <span class="label" id="timerLabel">Repos</span>
      <span class="time" id="timerTime">0:00</span>
    </div>
    <div class="bar"><i id="timerBar"></i></div>
    <div class="ctrls">
      <button data-action="timer-add" data-sec="-30">−30 s</button>
      <button data-action="timer-add" data-sec="30">+30 s</button>
      <button data-action="timer-reset">Reset</button>
      <button data-action="timer-stop" class="btn-primary">Fermer</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<nav class="tabs" id="tabs">
  <button data-tab="seance"><span>🏋️</span>Séance</button>
  <button data-tab="historique"><span>📅</span>Historique</button>
  <button data-tab="programme"><span>📝</span>Programme</button>
  <button data-tab="reglages"><span>⚙️</span>Réglages</button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <p id="modalMsg"></p>
    <div class="actions">
      <button id="modalNo">Annuler</button>
      <button id="modalYes" class="btn-primary">Confirmer</button>
    </div>
  </div>
</div>

<div class="modal viewer" id="viewer" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
    <h2 id="viewerTitle"></h2>
    <p id="viewerTip"></p>
    <p class="small muted" id="viewerMuscles"></p>
    <div class="pics">
      <figure><img id="viewerImg0" alt="Position de départ"><figcaption>1. Départ</figcaption></figure>
      <figure><img id="viewerImg1" alt="Position finale"><figcaption>2. Arrivée</figcaption></figure>
    </div>
    <button class="btn-primary btn-block" id="viewerClose">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  // ---------- Programme A/B (prise de masse, barre + banc + haltères) ----------
  // rest = temps de repos recommandé en secondes.
  const PROGRAM_VERSION = 3;
  const DEFAULT_PROGRAM = [
    { id: 'A', name: 'Séance A', focus: 'Poussée / Bas du corps', exercises: [
      { name: 'Développé couché à la barre', sets: 4, reps: '6-8', rest: 120, equip: 'barre' },
      { name: 'Goblet Squat ou Squat barre', sets: 4, reps: '8-10', rest: 120, equip: 'barre' },
      { name: 'Fentes arrière', sets: 3, reps: '10 / jambe', rest: 90, equip: 'halteres' },
      { name: 'Élévations latérales', sets: 3, reps: '12-15', rest: 90, equip: 'halteres' },
    ]},
    { id: 'B', name: 'Séance B', focus: 'Tirage / Chaîne postérieure', exercises: [
      { name: 'Soulevé de terre jambes tendues à la barre (RDL)', sets: 4, reps: '8-10', rest: 120, equip: 'barre' },
      { name: 'Rowing buste penché à la barre', sets: 4, reps: '8-10', rest: 120, equip: 'barre' },
      { name: 'Développé militaire debout', sets: 3, reps: '8-10', rest: 90, equip: 'halteres' },
      { name: 'Curls biceps', sets: 3, reps: '10-12', rest: 90, equip: 'halteres' },
    ]},
  ];
  // Matériel : la barre se charge en disques (lb), les haltères sont en kg.
  const EQUIP = { barre: 'Barre', halteres: 'Haltères' };
  const defaultEquip = (name) => {
    for (const d of DEFAULT_PROGRAM) for (const e of d.exercises) if (e.name.trim().toLowerCase() === String(name).trim().toLowerCase()) return e.equip;
    return /barre/i.test(name) ? 'barre' : 'halteres';
  };
  const REST_CHOICES = [60, 90, 120, 150, 180, 240];
  const DEFAULT_REST = 90;

  const STORAGE_KEY = 'gymSousSol.v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function freshProgram() {
    return clone(DEFAULT_PROGRAM).map(d => ({
      ...d, exercises: d.exercises.map(e => ({ id: uid(), ...e }))
    }));
  }

  // ---------- État + persistance ----------
  let state = load();
  let tab = 'seance';
  let historyMode = 'seances';

  function load() {
    const base = { programVersion: PROGRAM_VERSION, program: freshProgram(), history: [], draft: null,
      settings: { unit: 'kg', barUnit: 'lb', dbUnit: 'kg', barWeight: 20, sound: true, autoRest: false } };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return base;
      const data = JSON.parse(raw);
      const st = { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
      // Programme d'une version précédente : on passe au programme actuel en gardant l'historique.
      if (data.programVersion !== PROGRAM_VERSION) {
        st.programVersion = PROGRAM_VERSION;
        st.program = freshProgram();
        st.draft = null;
        if (!st.history.length) st.settings.unit = 'kg';
      }
      // Données d'avant le choix barre/haltères : on déduit le matériel du nom.
      st.program.forEach(d => d.exercises.forEach(e => { if (!e.equip) e.equip = defaultEquip(e.name); }));
      if (st.draft) st.draft.exercises.forEach(e => { if (!e.equip) e.equip = defaultEquip(e.name); });
      return st;
    } catch (e) { return base; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('⚠️ Sauvegarde impossible'); }
  }

  // ---------- Utilitaires ----------
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
  const fmtNum = (n) => n == null ? '' : (Math.round(n * 10) / 10).toString().replace('.', ',');
  const fmtDate = (ts) => new Date(ts).toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const fmtShortDate = (ts) => new Date(ts).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  const fmtDur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; };
  const fmtClock = (s) => `${s < 0 ? '-' : ''}${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, '0')}`;
  const fmtRest = (s) => { const m = Math.floor(s / 60), r = s % 60; return m ? `${m} min${r ? ' ' + String(r).padStart(2, '0') : ''}` : `${r} s`; };
  const key = (name) => String(name).trim().toLowerCase();
  const topReps = (reps) => { const m = String(reps).match(/(\d+)\s*(?:-\s*(\d+))?/); return m ? Number(m[2] || m[1]) : null; };
  const restOf = (ex) => Number(ex.rest) || DEFAULT_REST;
  const unitOf = (ex) => ex.equip === 'barre' ? state.settings.barUnit : ex.equip === 'halteres' ? state.settings.dbUnit : state.settings.unit;
  // Unité d'un exercice enregistré (les anciennes séances utilisaient l'unité globale).
  const savedUnit = (e) => e.unit || state.settings.unit;
  const toKg = (w, u) => u === 'lb' ? w * 0.45359237 : w;
  const barW = () => num(state.settings.barWeight) || 0;
  // Disques à mettre de chaque côté de la barre pour un poids total.
  function sideText(total) {
    const t = num(total);
    if (t == null) return '';
    const side = (t - barW()) / 2;
    if (side < 0) return 'moins que la barre';
    return side === 0 ? 'barre seule' : `${fmtNum(side)} / côté`;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Fenêtre de confirmation intégrée à la page (les boîtes natives sont bloquées dans certains navigateurs intégrés).
  function ask(msg, yesLabel = 'Confirmer', danger = false) {
    const m = document.getElementById('modal');
    const yes = document.getElementById('modalYes'), no = document.getElementById('modalNo');
    document.getElementById('modalMsg').textContent = msg;
    yes.textContent = yesLabel;
    yes.className = danger ? 'btn-danger' : 'btn-primary';
    m.hidden = false; yes.focus();
    return new Promise(resolve => {
      const done = (v) => { m.hidden = true; yes.onclick = no.onclick = m.onclick = null; resolve(v); };
      yes.onclick = () => done(true);
      no.onclick = () => done(false);
      m.onclick = (e) => { if (e.target === m) done(false); };
    });
  }

  // ---------- Photos et explications ----------
  const exInfo = (name) => EX_INFO[key(name)] || null;
  function thumb(name, small) {
    const info = exInfo(name);
    if (!info) return '';
    return `<button class="thumb ${small ? 'sm' : ''}" data-action="show-ex" data-name="${esc(name)}" aria-label="Voir comment faire : ${esc(name)}"><img src="${info.img[0]}" alt=""></button>`;
  }
  function showExercise(name) {
    const info = exInfo(name);
    if (!info) return;
    const v = document.getElementById('viewer');
    document.getElementById('viewerTitle').textContent = name;
    document.getElementById('viewerTip').textContent = info.tip;
    document.getElementById('viewerMuscles').textContent = 'Muscles : ' + info.muscles;
    document.getElementById('viewerImg0').src = info.img[0];
    document.getElementById('viewerImg1').src = info.img[1];
    v.hidden = false; v.querySelector('.sheet').scrollTop = 0;
    const close = () => { v.hidden = true; v.onclick = null; };
    document.getElementById('viewerClose').onclick = close;
    v.onclick = (e) => { if (e.target === v) close(); };
  }

  // ---------- Dernière séance + surcharge progressive ----------
  function lastPerf(name) {
    for (let i = state.history.length - 1; i >= 0; i--) {
      const s = state.history[i];
      const ex = s.exercises.find(e => key(e.name) === key(name));
      if (ex) {
        const sets = ex.sets.filter(x => x.done);
        if (sets.length) return { date: s.end, sets, unit: savedUnit(ex) };
      }
    }
    return null;
  }
  // Toutes les séries faites au haut de la fourchette la dernière fois → augmenter la charge.
  function progressionHint(ex, last) {
    const top = topReps(ex.reps);
    if (!last || !top || last.sets.length < ex.target.sets) return '';
    if (!last.sets.every(s => (num(s.r) || 0) >= top)) return '';
    const step = ex.equip === 'barre'
      ? (state.settings.barUnit === 'lb' ? 'essaie +5 lb (2,5 lb de chaque côté)' : 'essaie +2,5 kg (1,25 kg de chaque côté)')
      : (state.settings.dbUnit === 'kg' ? 'prends les haltères suivants (+1 à 2 kg)' : 'prends les haltères suivants (+2,5 à 5 lb)');
    return `↑ ${top} réps partout la dernière fois : ${step}.`;
  }

  function nextDayId() {
    if (!state.history.length) return state.program[0]?.id;
    const lastId = state.history[state.history.length - 1].dayId;
    const idx = state.program.findIndex(d => d.id === lastId);
    return state.program[(idx + 1) % state.program.length]?.id;
  }

  // ---------- Rendu ----------
  function render() {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (tab === 'seance') state.draft ? renderWorkout() : renderHome();
    else if (tab === 'historique') renderHistory();
    else if (tab === 'programme') renderProgram();
    else renderSettings();
  }

  function renderWorkout() {
    const w = state.draft;
    const doneCount = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    const total = w.exercises.reduce((a, e) => a + e.sets.length, 0);
    $app.innerHTML = `

        </div>
        ${w.exercises.map((ex, i) => {
          const last = lastPerf(ex.name);
          const hint = progressionHint(ex, last);
          const rest = restOf(ex);
          // Dernière série cochée : c'est sous elle qu'on propose de lancer le repos.
          let lastDone = -1; ex.sets.forEach((s, j) => { if (s.done) lastDone = j; });
          const allDone = ex.sets.length && ex.sets.every(s => s.done);
          const unit = unitOf(ex);
          const isBar = ex.equip === 'barre';
          return `
          <div class="card">
            <div class="ex-head">
              ${thumb(ex.name)}
              <div class="title">
                <h3>${esc(ex.name)}</h3>
                <div class="ex-meta">
                  <span class="tag ${allDone ? 'ok' : ''}">${ex.target.sets} × ${esc(ex.reps)}</span>
                  <span class="tag rest">⏱ Repos ${fmtRest(rest)}</span>
                  ${exInfo(ex.name) ? `<button class="link" data-action="show-ex" data-name="${esc(ex.name)}">Comment faire ?</button>` : ''}

                </div>
              </div>
            </div>
            ${last ? `<p class="last">Dernière fois (${fmtShortDate(last.date)}) : ${last.sets.map(s => `${s.w ? fmtNum(num(s.w)) + ' ' + last.unit + ' × ' : ''}${esc(s.r)}`).join(' · ')}</p>` : '<p class="last">Première fois : choisis une charge que tu peux soulever proprement.</p>'}
            ${isBar ? `<p class="last">Barre de ${fmtNum(barW())} ${unit} : entre le poids total, l'app calcule les disques par côté.</p>` : ''}
            ${hint ? `<p class="hint">${hint}</p>` : ''}
            <table class="sets">
              <thead><tr><th>#</th><th>${isBar ? `Total (${unit})` : `Par haltère (${unit})`}</th><th>Réps</th><th></th></tr></thead>
              <tbody>
                ${ex.sets.map((s, j) => `
                  <tr class="${s.done ? 'done' : ''}">

                    <td><input inputmode="numeric" data-field="r" data-ex="${i}" data-set="${j}" value="${esc(s.r)}" placeholder="${topReps(ex.reps) || '—'}" aria-label="Répétitions série ${j + 1}"></td>
                    <td class="chk"><button class="check" data-action="toggle-set" data-ex="${i}" data-set="${j}" aria-label="Série ${j + 1} terminée">✓</button></td>
                  </tr>
                  ${j === lastDone && !(allDone && i === w.exercises.length - 1) ? `
                  <tr><td></td><td colspan="3">
                    <button class="rest-btn" data-action="rest" data-ex="${i}">⏱ Lancer le repos · ${fmtClock(rest)}</button>

            <div class="row" style="margin-top:8px">
              <button class="btn-sm btn-ghost" data-action="add-set" data-ex="${i}">+ Série</button>

        <div class="card">
          <label for="notes">Notes de séance</label>
          <textarea id="notes" rows="2" data-field="notes" placeholder="Énergie, douleurs, ajustements…">${esc(w.notes)}</textarea>
        </div>
        <button class="btn-block btn-primary btn-big" data-action="finish">Terminer la séance ✅</button>
        <button class="btn-block btn-danger" data-action="cancel">Abandonner la séance</button>
      </div>`;
  }

  function sessionVolume(s) {
    return s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).reduce((b, x) => b + toKg(num(x.w) || 0, savedUnit(e)) * (num(x.r) || 0), 0), 0);
  }

  function renderHistory() {
    let body;
    if (historyMode === 'seances') {
      body = state.history.length ? state.history.slice().reverse().map(s => `
        <details class="card">
          <summary>
            <div class="row between">
              <div>
                <h3>${esc(s.dayName)} <span class="muted small">· ${esc(s.focus || '')}</span></h3>
                <p class="muted small">${fmtDate(s.end)} · ${fmtDur(s.end - s.start)} · ≈ ${Math.round(sessionVolume(s)).toLocaleString('fr-CA')} kg soulevés</p>
              </div>
              <span class="muted">▾</span>
            </div>
          </summary>
          <ul class="plain small">
            ${s.exercises.map(e => {
              const d = e.sets.filter(x => x.done);
              return `<li><span>${esc(e.name)}</span><span class="muted" style="text-align:right">${d.length ? d.map(x => `${x.w ? fmtNum(num(x.w)) + '×' : ''}${esc(x.r)}`).join(' · ') + (d.some(x => x.w) ? ` <span class="small">(${savedUnit(e)})</span>` : '') : '—'}</span></li>`;
            }).join('')}
          </ul>
          ${s.notes ? `<p class="small" style="margin-top:8px">📝 ${esc(s.notes)}</p>` : ''}
          <button class="btn-sm btn-danger" style="margin-top:10px" data-action="delete-session" data-id="${s.id}">Supprimer</button>
        </details>`).join('') : '<p class="muted">Aucune séance terminée pour l\'instant. Lance ta première séance depuis l\'onglet Séance.</p>';
    } else {
      const recs = {};
      state.history.forEach(s => s.exercises.forEach(e => e.sets.filter(x => x.done).forEach(x => {
        const w = num(x.w), r = num(x.r);
        if (!w || !r) return;
        const est = w * (1 + r / 30); // Formule d'Epley
        const u = savedUnit(e);
        const k = key(e.name) + '|' + u;
        if (!recs[k] || w > recs[k].w || (w === recs[k].w && r > recs[k].r)) {
          recs[k] = { name: e.name, unit: u, w, r, date: s.end, est: Math.max(est, recs[k]?.est || 0) };
        } else if (est > recs[k].est) recs[k].est = est;
      })));
      const list = Object.values(recs).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      body = list.length ? `<div class="card"><ul class="plain">
        ${list.map(r => `<li><span>${esc(r.name)}<br><span class="muted small">${fmtDate(r.date)}</span></span>
          <span style="text-align:right"><strong>${fmtNum(r.w)} ${r.unit} × ${fmtNum(r.r)}</strong><br><span class="muted small">1RM est. ≈ ${fmtNum(Math.round(r.est))} ${r.unit}</span></span></li>`).join('')}
      </ul></div>` : '<p class="muted">Les records apparaîtront après ta première séance avec des poids.</p>';
    }
    $app.innerHTML = `
      <div class="stack">
        <h1>Historique</h1>
        <div class="seg">
          <button data-action="hist-mode" data-mode="seances" class="${historyMode === 'seances' ? 'active' : ''}">Séances (${state.history.length})</button>
          <button data-action="hist-mode" data-mode="records" class="${historyMode === 'records' ? 'active' : ''}">Records</button>
        </div>
        ${body}
      </div>`;
  }

                  ${Object.entries(EQUIP).map(([k, label]) => `<option value="${k}" ${e.equip === k ? 'selected' : ''}>${label} (${k === 'barre' ? state.settings.barUnit : state.settings.dbUnit})</option>`).join('')}
                </select></div>

            <button class="btn-sm" style="margin-top:10px" data-action="add-ex" data-day="${di}">+ Ajouter un exercice</button>

  // ---------- Séance ----------
  function startWorkout(dayId) {
    const d = state.program.find(x => x.id === dayId);
    if (!d) return;
    state.draft = {
      id: uid(), dayId: d.id, dayName: d.name, focus: d.focus, start: Date.now(), notes: '',
      exercises: d.exercises.map(e => {
        // Pré-remplissage avec la dernière séance enregistrée de cet exercice.
        const last = lastPerf(e.name);
        const equip = e.equip || defaultEquip(e.name);
        const sameUnit = last && last.unit === unitOf({ equip });
        const n = Math.max(1, Number(e.sets) || 1);
        return {
          name: e.name, reps: e.reps, rest: restOf(e), equip, target: { sets: n, reps: e.reps },
          sets: Array.from({ length: n }, (_, j) => {
            const ref = last && (last.sets[j] || last.sets[last.sets.length - 1]);
            return { w: ref && sameUnit ? ref.w || '' : '', r: ref ? ref.r || '' : '', done: false };
          }),
        };
      }),
    };
    save(); requestWakeLock(); render(); window.scrollTo(0, 0);
  }

  function toggleSet(i, j) {
    const ex = state.draft.exercises[i];
    const s = ex.sets[j];
    if (!s.done) {
      const prev = ex.sets[j - 1];
      if (!s.w && prev) s.w = prev.w;
      if (!s.r) s.r = (prev && prev.r) || String(topReps(ex.reps) || '');
      s.done = true;
      if (state.settings.autoRest) startTimer(restOf(ex), ex.name);
    } else {
      s.done = false;
    }
    save(); render();
  }

  async function finishWorkout() {
    const w = state.draft;
    const done = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    if (!done && !(await ask('Aucune série cochée. Enregistrer quand même ?', 'Enregistrer'))) return;
    w.end = Date.now();
    w.exercises.forEach(e => { e.unit = unitOf(e); });
    state.history.push(w);
    state.draft = null;
    stopTimer(); releaseWakeLock(); save();
    tab = 'historique'; historyMode = 'seances';
    render(); window.scrollTo(0, 0);
    toast('Séance enregistrée 🎉');
  }

  // ---------- Minuteur de repos ----------
  let timerEnd = 0, timerDur = 0, timerBase = 0, timerName = '', timerInt = null, timerRang = false, audioCtx = null;
  const $timer = document.getElementById('timer');
  const $timerTime = document.getElementById('timerTime');
  const $timerBar = document.getElementById('timerBar');
  const $timerLabel = document.getElementById('timerLabel');

  function startTimer(sec, label) {
    timerBase = timerDur = sec; timerName = label || '';
    timerEnd = Date.now() + sec * 1000; timerRang = false;
    $timerLabel.textContent = `Repos · ${timerName}`;
    document.body.classList.add('timer-on');
    $timer.classList.remove('finished');
    clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); tickTimer();
  }
  function stopTimer() {
    clearInterval(timerInt); timerInt = null;
    document.body.classList.remove('timer-on');
  }
  function tickTimer() {
    const left = Math.ceil((timerEnd - Date.now()) / 1000);
    if (left > 0) {
      $timerTime.textContent = fmtClock(left);
      $timerBar.style.width = Math.min(100, (left / timerDur) * 100) + '%';
      return;
    }
    $timerTime.textContent = 'Go ! +' + fmtClock(-left);
    $timerBar.style.width = '100%';
    if (!timerRang) { timerRang = true; $timer.classList.add('finished'); endSignal(); }
  }
  function endSignal() {
    const f = document.getElementById('flash');
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    if (state.settings.sound) {
      beep();
      try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
    }
  }
  // Le son ne peut démarrer qu'après un geste : on « débloque » l'audio au premier toucher.
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function beep() {
    if (!audioCtx) return;
    try {
      [0, 0.3, 0.6].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.22);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.22);
      });
    } catch (e) {}
  }

  // Garde l'écran allumé pendant la séance (si supporté).
  let wakeLock = null;
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator && state.draft) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { requestWakeLock(); if (timerInt) tickTimer(); } });

  // Durée de séance
  setInterval(() => {
    const el = document.getElementById('elapsed');
    if (el && state.draft) el.textContent = fmtDur(Date.now() - state.draft.start);
  }, 15000);

  // ---------- Événements ----------
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });

  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const a = b.dataset.action;
    const i = Number(b.dataset.ex), j = Number(b.dataset.set), di = Number(b.dataset.day);
    switch (a) {
      case 'start':
        if (state.draft && !(await ask('Une séance est déjà en cours. La remplacer ?', 'Remplacer', true))) return;
        startWorkout(b.dataset.day); break;
      case 'toggle-set': toggleSet(i, j); break;
      case 'rest': { const ex = state.draft.exercises[i]; unlockAudio(); startTimer(restOf(ex), ex.name); break; }
      case 'show-ex': showExercise(b.dataset.name); break;
      case 'add-set': {
        const sets = state.draft.exercises[i].sets;
        const last = sets[sets.length - 1] || {};
        sets.push({ w: last.w || '', r: last.r || '', done: false }); save(); render(); break;
      }
      case 'remove-set': state.draft.exercises[i].sets.pop(); save(); render(); break;
      case 'finish': finishWorkout(); break;
      case 'cancel':
        if (await ask('Abandonner cette séance ? Les séries saisies seront perdues.', 'Abandonner', true)) {
          state.draft = null; stopTimer(); releaseWakeLock(); save(); render();
        }
        break;
      case 'timer-add': {
        timerEnd += Number(b.dataset.sec) * 1000;
        const left = (timerEnd - Date.now()) / 1000;
        if (left > timerDur) timerDur = Math.ceil(left);
        if (left > 0) { timerRang = false; $timer.classList.remove('finished'); }
        tickTimer(); break;
      }
      case 'timer-reset': startTimer(timerBase, timerName); break;
      case 'timer-stop': stopTimer(); break;
      case 'test-signal': unlockAudio(); endSignal(); break;
      case 'hist-mode': historyMode = b.dataset.mode; render(); break;
      case 'delete-session':
        if (await ask('Supprimer définitivement cette séance ?', 'Supprimer', true)) {
          state.history = state.history.filter(s => s.id !== b.dataset.id); save(); render();
        }
        break;
      case 'add-ex': state.program[di].exercises.push({ id: uid(), name: 'Nouvel exercice', sets: 3, reps: '10-12', rest: DEFAULT_REST, equip: 'halteres' }); save(); render(); break;
      case 'del-ex':
        if (await ask(`Retirer « ${state.program[di].exercises[i].name} » du programme ?`, 'Retirer', true)) {
          state.program[di].exercises.splice(i, 1); save(); render();
        }
        break;
      case 'reset-program':
        if (await ask('Rétablir le programme A/B d\'origine ? Ton historique est conservé.', 'Rétablir')) {
          state.program = freshProgram(); save(); render(); toast('Programme rétabli');
        }
        break;
      case 'unit': state.settings[b.dataset.target] = b.dataset.unit; save(); render(); break;
      case 'equip': state.draft.exercises[i].equip = b.dataset.equip; save(); render(); break;
      case 'sound': state.settings.sound = !state.settings.sound; save(); render(); break;
      case 'auto-rest': state.settings.autoRest = !state.settings.autoRest; save(); render(); break;
      case 'export': exportData(); break;
      case 'import': document.getElementById('importFile').click(); break;
      case 'copy-backup': {
        const txt = backupJson();
        try { await navigator.clipboard.writeText(txt); toast('Sauvegarde copiée'); }
        catch (err) {
          const ta = document.getElementById('pasteBackup');
          ta.value = txt; ta.closest('details').open = true; ta.select();
          toast('Sélectionne le texte et copie-le');
        }
        break;
      }
      case 'import-paste': importText(document.getElementById('pasteBackup').value); break;
      case 'wipe':
        if (await ask('Effacer TOUT (historique, programme, réglages) ? Action irréversible.', 'Tout effacer', true)) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
          state = load(); stopTimer(); render(); toast('Données effacées');
        }
        break;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.field && state.draft) {
      if (t.dataset.field === 'notes') state.draft.notes = t.value;
      else {
        state.draft.exercises[t.dataset.ex].sets[t.dataset.set][t.dataset.field] = t.value.trim();
        const side = document.getElementById(`side-${t.dataset.ex}-${t.dataset.set}`);
        if (side && t.dataset.field === 'w') side.textContent = sideText(t.value);
      }
      save(); return;
    }
    if (t.dataset.setting === 'barWeight') { state.settings.barWeight = num(t.value) ?? 0; save(); return; }
    if (t.dataset.prog) {
      const d = state.program[t.dataset.day];
      const ex = d.exercises[t.dataset.ex];
      switch (t.dataset.prog) {
        case 'day-name': d.name = t.value; break;
        case 'day-focus': d.focus = t.value; break;
        case 'ex-name': ex.name = t.value; break;
        case 'ex-sets': ex.sets = Math.min(10, Math.max(1, parseInt(t.value, 10) || 1)); break;
        case 'ex-reps': ex.reps = t.value; break;
        case 'ex-rest': ex.rest = Number(t.value); break;
        case 'ex-equip': ex.equip = t.value; break;
      }
      save();
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'importFile' && t.files[0]) importData(t.files[0]);
  });

  // ---------- Sauvegarde ----------
  function backupJson() {
    return JSON.stringify({ app: 'gym-sous-sol', exportedAt: new Date().toISOString(), ...state, draft: null }, null, 2);
  }
  function exportData() {
    const blob = new Blob([backupJson()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gym-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => importText(reader.result);
    reader.readAsText(file);
  }
  async function importText(text) {
    let data;
    try {
      data = JSON.parse(text);
      if (!Array.isArray(data.history) || !Array.isArray(data.program)) throw new Error('format');
    } catch (err) { toast('Texte invalide : ce n\'est pas une sauvegarde de cette app'); return; }
    if (!(await ask(`Importer ${data.history.length} séance(s) ? Les données actuelles seront remplacées.`, 'Importer', true))) return;
    state = { programVersion: PROGRAM_VERSION, program: data.program, history: data.history, draft: null,
      settings: { ...state.settings, ...(data.settings || {}) } };
    save(); render(); toast('Sauvegarde importée');
  }

  // Cache hors-ligne quand l'app est hébergée (ignoré si le fichier est ouvert directement).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Démarrage
  if (state.draft) requestWakeLock();
  render();
})();
</script>
</body>
</html>
